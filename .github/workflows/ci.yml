name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: windows / fmt + clippy + test + release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 保持一致；显式指定才能保证 clippy/rustfmt
          # 装在这个版本上，而不是默认的 stable。
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: deny (licenses / advisories / sources / bans)
        run: cargo deny --all-features check

      - name: release build
        run: cargo build --locked --release

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: tlshell-x86_64-pc-windows-msvc
          path: target/release/tlshell.exe
          if-no-files-found: error
